name: Build
on: [pull_request, push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: CacaoVisualClient
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CacaoVisualClient
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          jar="CacaoVisualClient-$version.jar"
          test -f "$jar"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" \
            --jq 'select(.object.type == "tag") | .object.sha')
          if [ -z "$tag_sha" ]; then
            echo "Use an annotated tag with release notes."
            exit 1
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .message > "$notes"
          gh release create "$GITHUB_REF_NAME" "$jar" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --notes-file "$notes" --title "CacaoVisualClient $version"
